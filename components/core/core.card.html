<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:20px;background:var(--surface-page);font-family:var(--font-body)}#root{display:block}a{color:var(--coop-red)}a:hover{color:var(--coop-red-dark)}</style></head><body><div id="root"></div>
<script type="text/babel">
const { Button, IconButton, Card, Badge, Logo } = window.TheCoopDesignSystem_a9fb85;
const Row = ({children,gap=12}) => <div style={{display:'flex',gap,alignItems:'center',flexWrap:'wrap'}}>{children}</div>;
ReactDOM.createRoot(document.getElementById('root')).render(<div style={{display:'grid',gap:18}}>
  <Row>
    <Button variant="primary" size="lg">ORDER NOW</Button>
    <Button variant="dark">SEE THE MENU</Button>
    <Button variant="light">FIND US</Button>
    <Button variant="ghost" size="sm">Cancel</Button>
    <Button variant="primary" size="sm" disabled>SOLD OUT</Button>
    <IconButton label="Cart" variant="red" size={44}><i data-lucide="shopping-bag"></i></IconButton>
  </Row>
  <Row>
    <Badge tone="red">New</Badge><Badge tone="black">Truck open</Badge>
    <Badge tone="white">Limited</Badge><Badge tone="maple" size="sm">Fan favorite</Badge>
    <Badge tone="buffalo" size="sm">Spicy</Badge>
  </Row>
  <Row gap={16}>
    <Card sticker hoverLift style={{width:200}}><strong style={{fontFamily:'var(--font-poster)',fontSize:18}}>PAPER</strong><p style={{margin:'6px 0 0',fontSize:13,color:'var(--text-muted)'}}>default card</p></Card>
    <Card tone="board" sticker style={{width:180}}><strong style={{fontFamily:'var(--font-poster)',fontSize:18}}>BOARD</strong></Card>
    <Card tone="red" sticker style={{width:150}}><strong style={{fontFamily:'var(--font-poster)',fontSize:18}}>RED</strong></Card>
    <Logo width={130} assetBase="../../" />
  </Row>
</div>);
</script>
<script src="https://unpkg.com/lucide@0.446.0/dist/umd/lucide.min.js"></script>
<script>setTimeout(()=>window.lucide&&window.lucide.createIcons(),300)</script>

<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:20px;background:var(--surface-page);font-family:var(--font-body)}#root{display:block}a{color:var(--coop-red)}a:hover{color:var(--coop-red-dark)}</style></head><body><div id="root"></div>
<script type="text/babel">
const { Input, Select, Checkbox, Radio, Switch, Stepper } = window.TheCoopDesignSystem_a9fb85;
function App(){
  const [bacon,setBacon]=React.useState(true);
  const [mode,setMode]=React.useState('pickup');
  const [notify,setNotify]=React.useState(true);
  const [qty,setQty]=React.useState(2);
  return <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:24}}>
    <div style={{display:'grid',gap:16}}>
      <Input label="Name for the order" placeholder="e.g. Dana" hint="We'll shout it out." />
      <Input label="Phone" defaultValue="555-13" error="Need 10 digits" />
      <Select label="Pickup time" options={['ASAP','12:15','12:30','12:45']} />
    </div>
    <div style={{display:'grid',gap:16,alignContent:'start'}}>
      <Checkbox label="Add bacon" description="+$2" checked={bacon} onChange={setBacon} />
      <Checkbox label="Extra pickles" description="free, always" />
      <div style={{display:'grid',gap:10}}>
        <Radio name="f" value="pickup" label="Pickup at the truck" checked={mode==='pickup'} onChange={setMode} />
        <Radio name="f" value="catering" label="Catering quote" checked={mode==='catering'} onChange={setMode} />
      </div>
      <Switch label="Text me when it's ready" checked={notify} onChange={setNotify} />
      <Stepper value={qty} onChange={setQty} min={1} />
    </div>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>

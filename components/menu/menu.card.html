<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>

<style>body{margin:0;padding:20px;background:var(--surface-page);font-family:var(--font-body)}#root{display:block}a{color:var(--coop-red)}a:hover{color:var(--coop-red-dark)}</style></head><body><div id="root"></div>
<script type="text/babel">
const { MenuSection, MenuItem, SauceChip, SAUCES, DashRule, PriceTag, HeatMeter } = window.TheCoopDesignSystem_a9fb85;
function App(){
  const [pick,setPick] = React.useState('nashville-hot');
  return <div style={{display:'grid',gap:18}}>
    <MenuSection title="Entrees">
      <MenuItem name="The Original" price={12} description="fried chicken sandwich with coleslaw, pickles, and comeback sauce" />
      <MenuItem name="The Nashville" price={14} heat={2} badge="New" description="fried chicken sandwich with nashville hot seasoning, bacon, coleslaw, pickles, and comeback sauce" />
    </MenuSection>
    <DashRule />
    <div style={{background:'var(--coop-black)',borderRadius:'var(--radius-lg)',padding:16}}>
      <MenuSection tone="board" title="Dipped" note="get any chicken item dipped in one of our truckmade sauces" />
      <div style={{display:'flex',gap:8,flexWrap:'wrap',marginTop:10}}>
        {SAUCES.map(s => <SauceChip key={s.id} sauce={s.id} selected={pick===s.id} onSelect={setPick} />)}
      </div>
    </div>
    <div style={{display:'flex',gap:32,alignItems:'center'}}>
      <MenuItem name="Waffle Fries" price={5} compact style={{minWidth:220}} />
      <MenuItem name="Mac N Cheese" price={5} compact soldOut style={{minWidth:220}} />
      <PriceTag value={13} size="lg" tone="red" />
      <HeatMeter level={3} size={22} />
    </div>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);

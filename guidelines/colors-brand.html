<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px;background:var(--surface-page);font-family:var(--font-body);color:var(--text-body)}a{color:var(--coop-red)}a:hover{color:var(--coop-red-dark)}.lbl{font-family:var(--font-mono);font-size:10px;color:var(--gray-600);letter-spacing:.04em}</style></head><body><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px">
<div style="display:grid;gap:6px"><div style="height:64px;border-radius:12px;border:3px solid var(--coop-black);background:var(--coop-red)"></div><div style="font-family:var(--font-poster);font-size:12px;letter-spacing:.05em">Coop Red</div><div class="lbl">--coop-red</div></div><div style="display:grid;gap:6px"><div style="height:64px;border-radius:12px;border:3px solid var(--coop-black);background:var(--coop-red-dark)"></div><div style="font-family:var(--font-poster);font-size:12px;letter-spacing:.05em">Red Dark</div><div class="lbl">--coop-red-dark</div></div><div style="display:grid;gap:6px"><div style="height:64px;border-radius:12px;border:3px solid var(--coop-black);background:var(--coop-black)"></div><div style="font-family:var(--font-poster);font-size:12px;letter-spacing:.05em">Coop Black</div><div class="lbl">--coop-black</div></div><div style="display:grid;gap:6px"><div style="height:64px;border-radius:12px;border:3px solid var(--coop-black);background:var(--coop-white)"></div><div style="font-family:var(--font-poster);font-size:12px;letter-spacing:.05em">White</div><div class="lbl">--coop-white</div></div></div></body></html>

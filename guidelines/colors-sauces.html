<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px;background:var(--surface-page);font-family:var(--font-body);color:var(--text-body)}a{color:var(--coop-red)}a:hover{color:var(--coop-red-dark)}.lbl{font-family:var(--font-mono);font-size:10px;color:var(--gray-600);letter-spacing:.04em}</style></head><body><div style="background:var(--coop-black);border-radius:16px;padding:16px;display:grid;grid-template-columns:repeat(6,1fr);gap:12px">

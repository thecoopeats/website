<!-- @dsCard group="Brand" viewport="700x170" name="Motion" subtitle="Fast pops, 110–380ms, springy easing" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px;background:var(--surface-page);font-family:var(--font-body);color:var(--text-body)}a{color:var(--coop-red)}a:hover{color:var(--coop-red-dark)}.lbl{font-family:var(--font-mono);font-size:10px;color:var(--gray-600);letter-spacing:.04em}</style></head><body><div style="display:grid;gap:10px;font-family:var(--font-mono);font-size:12px">
<div>--dur-fast 110ms — press, hover</div><div>--dur-med 200ms — toggles, tabs</div><div>--dur-slow 380ms — modals, page transitions</div>
<div>--ease-pop cubic-bezier(.34,1.56,.64,1) — anything that should feel bouncy</div>
<div>--ease-standard cubic-bezier(.2,.8,.3,1) — everything else</div></div></body></html>

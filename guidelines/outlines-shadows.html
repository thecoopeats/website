<!-- @dsCard group="Brand" viewport="700x200" name="Keylines & sticker shadows" subtitle="Hard offset, zero blur — the core brand device" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px;background:var(--surface-page);font-family:var(--font-body);color:var(--text-body)}a{color:var(--coop-red)}a:hover{color:var(--coop-red-dark)}.lbl{font-family:var(--font-mono);font-size:10px;color:var(--gray-600);letter-spacing:.04em}</style></head><body><div style="display:flex;gap:20px;align-items:center;flex-wrap:wrap">
<div style="width:150px;height:88px;border:2px solid var(--coop-black);border-radius:16px;display:grid;place-items:center" class="lbl">stroke-1 · 2px</div>
<div style="width:150px;height:88px;border:3px solid var(--coop-black);border-radius:16px;box-shadow:4px 4px 0 var(--coop-black);display:grid;place-items:center" class="lbl">stroke-2 + sticker</div>
<div style="width:150px;height:88px;border:5px solid var(--coop-black);border-radius:16px;box-shadow:7px 7px 0 var(--coop-black);display:grid;place-items:center" class="lbl">stroke-3 + sticker-lg</div>
<div style="width:150px;height:88px;border:3px solid var(--coop-black);border-radius:16px;box-shadow:2px 2px 0 var(--coop-black);transform:translate(2px,2px);display:grid;place-items:center" class="lbl">pressed</div></div></body></html>

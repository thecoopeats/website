<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px;background:var(--surface-page);font-family:var(--font-body);color:var(--text-body)}a{color:var(--coop-red)}a:hover{color:var(--coop-red-dark)}.lbl{font-family:var(--font-mono);font-size:10px;color:var(--gray-600);letter-spacing:.04em}</style></head><body><div style="display:flex;align-items:flex-end;gap:12px">
<div style="display:grid;gap:6px;justify-items:center"><div style="width:4px;height:4px;background:var(--coop-red);border:2px solid var(--coop-black);border-radius:4px"></div><div class="lbl">1·4</div></div><div style="display:grid;gap:6px;justify-items:center"><div style="width:8px;height:8px;background:var(--coop-red);border:2px solid var(--coop-black);border-radius:4px"></div><div class="lbl">2·8</div></div><div style="display:grid;gap:6px;justify-items:center"><div style="width:12px;height:12px;background:var(--coop-red);border:2px solid var(--coop-black);border-radius:4px"></div><div class="lbl">3·12</div></div><div style="display:grid;gap:6px;justify-items:center"><div style="width:16px;height:16px;background:var(--coop-red);border:2px solid var(--coop-black);border-radius:4px"></div><div class="lbl">4·16</div></div><div style="display:grid;gap:6px;justify-items:center"><div style="width:24px;height:24px;background:var(--coop-red);border:2px solid var(--coop-black);border-radius:4px"></div><div class="lbl">5·24</div></div><div style="display:grid;gap:6px;justify-items:center"><div style="width:32px;height:32px;background:var(--coop-red);border:2px solid var(--coop-black);border-radius:4px"></div><div class="lbl">6·32</div></div><div style="display:grid;gap:6px;justify-items:center"><div style="width:48px;height:48px;background:var(--coop-red);border:2px solid var(--coop-black);border-radius:4px"></div><div class="lbl">7·48</div></div><div style="display:grid;gap:6px;justify-items:center"><div style="width:64px;height:64px;background:var(--coop-red);border:2px solid var(--coop-black);border-radius:4px"></div><div class="lbl">8·64</div></div><div style="display:grid;gap:6px;justify-items:center"><div style="width:96px;height:96px;background:var(--coop-red);border:2px solid var(--coop-black);border-radius:4px"></div><div class="lbl">9·96</div></div></div></body></html>
